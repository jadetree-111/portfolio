<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5de0">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Daily Hub</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="topbar">
    <h1 id="title">Daily Hub</h1>
    <div class="topbar-actions">
      <button id="btn-add" class="icon-btn" type="button" aria-label="添加备忘">＋</button>
      <a id="btn-settings" class="icon-btn" href="#/settings" aria-label="设置">⚙</a>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="主导航">
    <a href="#/today" data-route="today"><span aria-hidden="true">🏠</span>今天</a>
    <a href="#/tasks" data-route="tasks"><span aria-hidden="true">✅</span>备忘</a>
    <a href="#/calendar" data-route="calendar"><span aria-hidden="true">📅</span>日历</a>
    <a href="#/timetable" data-route="timetable"><span aria-hidden="true">🎓</span>课表</a>
    <a href="#/weather" data-route="weather"><span aria-hidden="true">⛅</span>天气</a>
  </nav>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
